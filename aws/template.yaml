AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CricScore Pro Web - Serverless Architecture (AWS Free Tier / On-Demand Mode)

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64

Resources:

  # 1. DynamoDB Table (PAY_PER_REQUEST / On-Demand = $0 Cost when Idle)
  CricMatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CricMatches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH

  # 2. JWT Signing Key Secret in AWS Secrets Manager
  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "cricscore-jwt-secret-${AWS::StackName}"
      Description: "JWT Signing Secret for CricScore Pro Web API"
      GenerateSecretString:
        SecretStringTemplate: '{"secretKey": ""}'
        GenerateStringKey: "secretKey"
        PasswordLength: 64
        ExcludePunctuation: true

  # 3. Private S3 Bucket for Static Web UI Hosting (5 GB Always Free)
  CricScoreWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "cricscore-pro-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 4. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: CricScoreOAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 5. S3 Bucket Policy allowing CloudFront Read Access
  CricScoreWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CricScoreWebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${CricScoreWebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CricScoreCDN}"

  # 6. CloudFront Distribution (1 TB Always Free Data Transfer)
  CricScoreCDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt CricScoreWebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # 7. API Gateway HTTP API v2 (1 Million Requests Free)
  CricScoreHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: CricScoreHttpApi
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${CricScoreCDN.DomainName}"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  # 8. AWS Lambda Backend API Handler (1 Million Requests Always Free)
  CricScoreApiLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambda
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref CricMatchesTable
          JWT_SECRET_ARN: !Ref JwtSigningSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource: !GetAtt CricMatchesTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JwtSigningSecret
      Events:
        PostAuthRegister:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /auth/register
            Method: POST
        PostAuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /auth/login
            Method: POST
        GetMatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /matches
            Method: GET
        PostMatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /matches
            Method: POST
        GetMatchById:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /matches/{id}
            Method: GET
        PutMatchById:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /matches/{id}
            Method: PUT
        DeleteMatchById:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /matches/{id}
            Method: DELETE
        GetTournaments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /tournaments
            Method: GET
        PostTournaments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /tournaments
            Method: POST
        DeleteTournaments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /tournaments/{id}
            Method: DELETE
        GetPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /players
            Method: GET
        PostPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /players
            Method: POST
        DeletePlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref CricScoreHttpApi
            Path: /players/{id}
            Method: DELETE

Outputs:
  WebUrl:
    Description: CloudFront Static Web URL for Intune Browser Users
    Value: !Sub "https://${CricScoreCDN.DomainName}"
  ApiUrl:
    Description: API Gateway HTTP API Endpoint
    Value: !Sub "https://${CricScoreHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  S3BucketName:
    Description: S3 Bucket Name for Static Web UI Deployment
    Value: !Ref CricScoreWebBucket
